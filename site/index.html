<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Takis Angelides Furnihome — Furnishing homes since 1965</title>
  <meta name="description" content="Natuzzi, Poliform, Porada, Calligaris, Cane-line and more — Europe’s finest furniture makers in four showrooms across Cyprus, since 1965.">
  <meta name="theme-color" content="#f5f3ef">
  <link rel="icon" href="img/logos/taf-acronym.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Noto+Serif+Display:ital,wght@0,200..500;1,200..300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="header" id="header">
    <div class="header-in">
      <a href="#/" class="logo" aria-label="Takis Angelides Furnihome">
        <img class="logo-dark" src="img/logos/taf.svg" alt="Takis Angelides Furnihome" width="160" height="47">
        <img class="logo-light" src="img/logos/taf-white.svg" alt="" width="160" height="47" aria-hidden="true">
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/brands" data-i18n="nav.houses"></a>
        <a href="#/inspiration" data-i18n="nav.inspiration"></a>
        <a href="#/showrooms" data-i18n="nav.showrooms"></a>
        <a href="#/story" data-i18n="nav.about"></a>
      </nav>
      <div class="header-end">
        <div class="lang" id="lang" role="group" aria-label="Language"></div>
        <button class="btn-line" data-book data-i18n="nav.book"></button>
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>
  <footer class="footer" id="footer"></footer>

  <dialog class="sheet" id="book" aria-labelledby="bookTitle"></dialog>
  <dialog class="piece" id="piece"></dialog>

  <script src="data/content.js"></script>
  <script src="data/i18n.js"></script>
  <script src="data/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
